name: cobrinha dracula

on:
  schedule:
    - cron: "17 3 * * *"   # todo dia de madrugada (UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff79c6&color_dots=#21222c,#44475a,#6272a4,#bd93f9,#ff79c6&color_dot_border=#191a21
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
